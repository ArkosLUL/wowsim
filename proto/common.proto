message TargetInput {
	InputType input_type = 1;
	string label = 2;
	string tooltip = 5;
	
	bool bool_value = 3;
	double number_value = 4;
}

message Target {
	// The in-game NPC ID.
	int32 id = 14;
	string name = 15;

	int32 level = 4;
	MobType mob_type = 3;
	repeated double stats = 5;

	// CREATURE_TYPE_FLAG_BOSS_MOB. A boss reads three levels above whoever attacks
	// it and dodges and parries far more than an ordinary creature its level.
	// Unset means a boss at raid boss level and above.
	optional bool world_boss = 20;

	// Auto attack parameters.
	double min_base_damage = 7;
	double damage_spread = 19; // replaces tight_enemy_damage
	double swing_speed = 8;
	bool dual_wield = 9;
	bool dual_wield_penalty = 10;
	bool parry_haste = 12;
	bool suppress_dodge = 16; // Sunwell Radiance
	SpellSchool spell_school = 13; // Allows elemental attacks.

	// Index in Raid.tanks indicating the player tanking this mob.
	// -1 or invalid index indicates not being tanked.
	int32 tank_index = 6;

	// Custom Target AI parameters
	repeated TargetInput target_inputs = 18;
}

message Encounter {
	double duration = 1;

	// Variation in the duration
	double duration_variation = 2;

	// The ratio of the encounter duration, between 0 and 1, for which the targets
	// will be in execute range (<= 20%) for the purposes of Warrior Execute, Mage Molten
	// Fury, etc.
	double execute_proportion_20 = 3;

	// Key for Affliction warlock Drain Soul
	double execute_proportion_25 = 7;

	// Same as execute_proportion but for 35%.
	double execute_proportion_35 = 4;

	// If set, will use the targets health value instead of a duration for fight length.
	bool use_health = 5;

	// If type != Simple or Custom, then this may be empty.
	repeated Target targets = 6;

	// Picks mod-dungeon-scale's raid multipliers.
	RaidDifficulty raid_difficulty = 8;

	// Server config the sim follows. Missing means the live server's.
	ServerSettings server_settings = 9;
}

// The instance a fight happens in, as the server sees it: max players and heroic.
enum RaidDifficulty {
	RaidDifficultyUnknown = 0; // the sim reads it as 25-player normal
	RaidDifficulty10Normal = 1;
	RaidDifficulty25Normal = 2;
	RaidDifficulty10Heroic = 3;
	RaidDifficulty25Heroic = 4;
}

// AzerothCore config that changes combat. Any unset field, or a missing message, takes the live
// server's value, generated by tools/acore/gen_server_defaults into
// sim/core/server_defaults_auto_gen.go and ui/core/constants/server_defaults_auto_gen.ts.
message ServerSettings {
	// MapUpdateInterval (worldserver.conf): the server tick in ms. 0 is sim only: exact timing, for
	// unit tests.
	optional int32 map_update_interval_ms = 1;

	SpellTweaksSettings spell_tweaks = 2;
	DungeonScaleSettings dungeon_scale = 3;
	ReforgeSettings reforge = 4;
}

// mod-spell-tweaks, keys SpellTweaks.*. Only its scripted tweaks switch off; its spell_dbc and SQL
// changes (talent values, tick crits for Murder and Trauma, ...) always apply.
message SpellTweaksSettings {
	// SpellTweaks.Enable. Off turns off every toggle below except the two armor pen ones, which core
	// reads itself. It also gates the tweaks with no toggle of their own: CS and DS seal stacks, Glyph
	// of Reckoning damage, Explosive Trap via Trap Launcher, the Detonate Mana and Frost Blast nerfs.
	optional bool enable = 1;

	// SpellTweaks.ExoticPetDamage.Pct: extra damage in percent for BM exotic pets. Below 0 counts as 0.
	optional double exotic_pet_damage_pct = 2;

	// SpellTweaks.HunterPetHaste.Enable: hunter pets inherit ranged haste.
	optional bool hunter_pet_haste = 3;

	// SpellTweaks.HunterPetArmorPen.Enable: hunter pets inherit armor pen. Not gated by enable.
	optional bool hunter_pet_armor_pen = 4;

	// SpellTweaks.DKGhoulArmorPen.Enable: the ghoul inherits armor pen. Not gated by enable.
	optional bool dk_ghoul_armor_pen = 5;

	// SpellTweaks.FeralSpiritHaste.Enable: spirit wolves inherit melee haste.
	optional bool feral_spirit_haste = 6;

	// SpellTweaks.DiseaseHaste.Enable: melee haste speeds up FF and BP ticks, with Epidemic.
	optional bool disease_haste = 7;

	// SpellTweaks.DeadlyPoisonMurder.Enable: melee haste speeds up Deadly Poison ticks, with Murder.
	optional bool deadly_poison_murder = 8;

	// SpellTweaks.RuptureWeaponExpertise.Enable: melee haste speeds up Rupture ticks, with Weapon
	// Expertise.
	optional bool rupture_weapon_expertise = 9;

	// SpellTweaks.RendTrauma.Enable: melee haste speeds up Rend ticks, with Trauma.
	optional bool rend_trauma = 10;

	// SpellTweaks.BalanceDotScaling.Enable: spell haste speeds up MF and IS ticks with Eclipse, and
	// they crit with Earth and Moon.
	optional bool balance_dot_scaling = 11;

	// SpellTweaks.TitansGrip.NoDamagePenalty.Enable: no -10% damage from Titan's Grip.
	optional bool titans_grip_no_damage_penalty = 12;

	// SpellTweaks.OmenClarityFaerieFire.Enable: FF (Feral) on an NPC always procs Clearcasting with
	// Omen.
	optional bool omen_clarity_faerie_fire = 13;
}

// mod-dungeon-scale's full raid stat modifiers, keys DungeonScale.StatModifier<set>[.Boss].<stat>.
// Bots fill the raid, so the player count curve is 1 and only these modifiers count.
//
// Which set applies (DungeonScale.cpp getStatModifiers):
// - 10 normal: raid10, 25 normal: raid25, 10 heroic: raid10_heroic, 25 heroic: raid25_heroic.
// - Bosses (IsDungeonBoss or isWorldBoss, plus their summons; world_boss in the sim) take the _boss
//   set, everything else the plain one. The two never mix.
// - A size set's unset field takes the live config's size key if it sets one, else the same field
//   of raid or raid_heroic (boss from boss). That's how the loader defaults the 10M and 25M keys.
//
// Combining: multiplier = global * stat, in float32. Health floors at DungeonScale.MinHPModifier and
// damage at DungeonScale.MinDamageModifier, armor has no floor. The server rounds the scaled health
// and armor to integers. Not modeled: per-instance and per-creature overrides, mana, CC duration.
// The 15, 20 and 40 player keys never match a WotLK raid.
message DungeonScaleSettings {
	DungeonScaleModifiers raid = 1; // StatModifierRaid
	DungeonScaleModifiers raid_boss = 2; // StatModifierRaid.Boss
	DungeonScaleModifiers raid_heroic = 3; // StatModifierRaidHeroic
	DungeonScaleModifiers raid_heroic_boss = 4; // StatModifierRaidHeroic.Boss
	DungeonScaleModifiers raid10 = 5; // StatModifierRaid10M
	DungeonScaleModifiers raid10_boss = 6; // StatModifierRaid10M.Boss
	DungeonScaleModifiers raid10_heroic = 7; // StatModifierRaid10MHeroic
	DungeonScaleModifiers raid10_heroic_boss = 8; // StatModifierRaid10MHeroic.Boss
	DungeonScaleModifiers raid25 = 9; // StatModifierRaid25M
	DungeonScaleModifiers raid25_boss = 10; // StatModifierRaid25M.Boss
	DungeonScaleModifiers raid25_heroic = 11; // StatModifierRaid25MHeroic
	DungeonScaleModifiers raid25_heroic_boss = 12; // StatModifierRaid25MHeroic.Boss
}

message DungeonScaleModifiers {
	optional double global = 1; // multiplies each stat below
	optional double health = 2;
	optional double armor = 3;
	optional double damage = 4; // creature melee and spell damage
}

// mod-reforging, keys Reforging.*.
message ReforgeSettings {
	// Reforging.Enable. Off, reforged items lose their reforge.
	optional bool enable = 1;

	// Reforging.Percentage: the share of the source stat moved, floor(value * pct / 100) in float32.
	// Outside [10, 90] the server uses 40.
	optional double percentage = 2;

	// Reforging.ReforgeableStats: ItemModType ids a reforge can take from or give to. Empty means the
	// live list; turn reforging off with enable instead. Over 15 ids and the server allows none.
	repeated int32 stat_types = 3;
}

message PresetTarget {
	string path = 1;
	Target target = 2;
}
message PresetEncounter {
	string path = 1;
	repeated PresetTarget targets = 2;
}

// mod-reforging: stat types are raw server ItemModType ids (6 spirit, 13 dodge, 14 parry, 31 hit,
// 32 crit, 36 haste, 37 expertise).
message ItemReforge {
	int32 from_stat_type = 1;
	int32 to_stat_type = 2;
}

// One item_template stat_type/stat_value pair, in the order the worldserver compacts them into
// ItemTemplate::ItemStat (zero values dropped), so the count is its StatsCount. mod-reforging reads
// these, not the sim's stats: the sim folds flat equip spells in and splits ratings into a melee and
// a spell stat.
message ItemStat {
	int32 stat_type = 1;
	int32 value = 2;
}

message ItemSpec {
	int32 id = 2;
	int32 enchant = 3;
	repeated int32 gems = 4;
	ItemReforge reforge = 5;
}

message EquipmentSpec {
	repeated ItemSpec items = 1;
}

message SimDatabase {
	repeated SimItem items = 1;
	repeated SimEnchant enchants = 2;
	repeated SimGem gems = 3;
}

// Contains only the Item info needed by the sim.
message SimItem {
	int32 id = 1;
	string name = 2;

	ItemType type = 3;
	ArmorType armor_type = 4;
	WeaponType weapon_type = 5;
	HandType hand_type = 6;
	RangedWeaponType ranged_weapon_type = 7;

	repeated double stats = 8;
	repeated GemColor gem_sockets = 9;
	repeated double socketBonus = 10;

	double weapon_damage_min = 11;
	double weapon_damage_max = 12;
	double weapon_speed = 13;

	string set_name = 14;

	repeated ItemStat server_stats = 15;
}

// Extra enum for describing which items are eligible for an enchant, when
// ItemType alone is not enough.
enum EnchantType {
	EnchantTypeNormal = 0;
	EnchantTypeTwoHand = 1;
	EnchantTypeShield = 2;
	EnchantTypeKit = 3;
	EnchantTypeStaff = 4;
}

// Contains only the Enchant info needed by the sim.
message SimEnchant {
	int32 effect_id = 1;
	repeated double stats = 2;
}

// Contains only the Gem info needed by the sim.
message SimGem {
	int32 id = 1;
	string name = 2;
	GemColor color = 3;
	repeated double stats = 4;
}

message UnitReference {
	enum Type {
		Unknown = 0;
		Player = 1;
		Target = 2;
		Pet = 3;
		Self = 4;
		CurrentTarget = 5;
		AllPlayers = 6;
		AllTargets = 7;
	}

	// The type of unit being referenced.
	Type type = 2;

	// Index of the player/target/pet/etc depending on value of type.
	int32 index = 3;

	// Reference to the owner, only used iff this is a pet.
	UnitReference owner = 4;
}

// ID for actions that aren't spells or items.
enum OtherAction {
	OtherActionNone = 0;
	OtherActionWait = 1;
	OtherActionManaRegen = 2;
	OtherActionEnergyRegen = 5;
	OtherActionFocusRegen = 6;
	OtherActionManaGain = 10; // For threat generated from mana gains.
	OtherActionRageGain = 11; // For threat generated from rage gains.
	OtherActionAttack = 3; // A white hit, can be main hand or off hand.
	OtherActionShoot = 4; // Default shoot action using a wand/bow/gun.
	OtherActionPet = 7; // Represents a grouping of all pet actions. Only used by the UI.
	OtherActionRefund = 8; // Refund of a resource like Energy or Rage, when the ability didn't land.
	OtherActionDamageTaken = 9; // Indicates damage taken; used for rage gen.
	OtherActionHealingModel = 12; // Indicates healing received from healing model.
	OtherActionBloodRuneGain = 13; // Indicates healing received from healing model.
	OtherActionFrostRuneGain  = 14; // Indicates healing received from healing model.
	OtherActionUnholyRuneGain  = 15; // Indicates healing received from healing model.
	OtherActionDeathRuneGain  = 16; // Indicates healing received from healing model.
	OtherActionPotion = 17; // Used by APL to generically refer to either the prepull or combat potion.
}

message ActionID {
	// Identifies this action.
	oneof raw_id {
		int32 spell_id = 1;
		int32 item_id = 2;
		OtherAction other_id = 3;
	}

	// Distinguishes between different versions of the same action.
	// Currently the only use for this is Shaman Lightning Overload.
	int32 tag = 4;
}

message Glyphs {
	int32 major1 = 1;
	int32 major2 = 2;
	int32 major3 = 3;
	int32 minor1 = 4;
	int32 minor2 = 5;
	int32 minor3 = 6;
}

// Custom options for a particular cooldown.
message Cooldown {
	// Identifies the cooldown to which these settings will apply.
	ActionID id = 1;

	// Fixed times at which to use this cooldown. Each value corresponds to a usage,
	// e.g. first value is the first usage, second value is the second usage.
	// Any usages after the specified timings will occur as soon as possible, subject
	// to the ShouldActivate() condition.
	repeated double timings = 2;
}

message Cooldowns {
	repeated Cooldown cooldowns = 1;

	// % HP threshold, below which defensive cooldowns can be used.
	double hp_percent_for_defensives = 2;
}

message HealingModel {
	// Healing per second to apply.
	double hps = 1;
	// How often healing is applied.
	double cadence_seconds = 2;
	// Variation in the cadence.
	double cadence_variation = 5;
	// % Inspiration buff uptime
	double inspiration_uptime = 3;
	// TMI burst window bin size
	int32 burst_window = 4;
}

message CustomRotation {
	repeated CustomSpell spells = 1;
}

message CustomSpell {
	// This should usually be a spec-specific enum value.
	int32 spell = 1;

	// Desired cast rate for this spell. Not used by most custom rotations, this is
	// primarily for healers.
	double casts_per_minute = 2;
}

message ItemSwap {
	ItemSpec mh_item = 1;
	ItemSpec oh_item = 2;
	ItemSpec ranged_item = 3;
}

message Duration {
	double ms = 1;
}
